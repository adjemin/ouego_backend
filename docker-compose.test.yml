# Base PostgreSQL + PostGIS dédiée aux tests (jamais la base de dev/prod).
# Démarrer : docker compose -f docker-compose.test.yml up -d
services:
  db-test:
    container_name: ouego-db-test
    platform: linux/amd64
    image: postgis/postgis:16-3.4-alpine
    ports:
      - '5435:5432'
    environment:
      POSTGRES_USER: ouego_test
      POSTGRES_PASSWORD: ouego_test
      POSTGRES_DB: ouego_test
    tmpfs:
      - /var/lib/postgresql/data   # données en RAM : rapide, éphémère
    healthcheck:
      # -h 127.0.0.1 : pendant l'init PostGIS, le serveur temporaire n'écoute que sur le socket
      # puis redémarre ; tester en TCP évite de déclarer la base prête trop tôt.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ouego_test -d ouego_test']
      interval: 2s
      timeout: 3s
      retries: 30
