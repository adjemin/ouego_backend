services:
  db-postgres:
    container_name: ouego-db-postgres
    platform: linux/amd64
    image: postgis/postgis:17-3.5-alpine
    ports:
      - 5434:5432
    volumes:
      - 'ouego_psql_data:/var/lib/postgresql/data'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ouego
    networks:
      - ouego-network
    restart: always

volumes:
  ouego_psql_data:
    driver: local
  
networks:
  ouego-network:
    driver: bridge